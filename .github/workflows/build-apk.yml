name: build-apk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/android/sdk/ndk /usr/local/graalvm \
            /usr/share/swift /usr/local/.ghcup 2>/dev/null || true
          df -h / | tail -1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache git gettext libltdl-dev

      - name: Restore fixed debug keystore
        # 매 빌드 동일 서명 → 재설치 시 'adb install -r'로 데이터(ID/카드) 유지.
        # 시크릿 미설정 시 기존처럼 CI가 임시 debug 키 자동 생성(서명 매번 달라짐).
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            mkdir -p ~/.android
            echo "$KS_B64" | base64 -d > ~/.android/debug.keystore
            echo "고정 debug.keystore 복원됨"
          else
            echo "시크릿 없음 — 자동 생성 debug 키 사용"
          fi

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install Cython buildozer==1.5.0

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build debug APK
        run: buildozer android debug

      - name: Re-sign APK with fixed key
        # buildozer가 자체 debug 키로 서명할 수 있어, 고정 키로 명시적으로 재서명해
        # 모든 빌드의 서명을 일관되게 만든다 → 재설치 시 'adb install -r'로 데이터 유지.
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "시크릿 없음 — 재서명 생략"; exit 0; fi
          KS=~/.android/debug.keystore
          APKSIGNER=$(find ~/.buildozer -path '*build-tools*' -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          ZIPALIGN=$(find ~/.buildozer -path '*build-tools*' -name zipalign -type f 2>/dev/null | sort -V | tail -1)
          echo "apksigner=$APKSIGNER"
          for apk in bin/*.apk; do
            if [ -n "$ZIPALIGN" ]; then
              "$ZIPALIGN" -f -p 4 "$apk" "$apk.aligned" && mv "$apk.aligned" "$apk"
            fi
            "$APKSIGNER" sign --ks "$KS" --ks-pass pass:android \
              --ks-key-alias androiddebugkey --key-pass pass:android "$apk"
            "$APKSIGNER" verify --print-certs "$apk" | grep -i "SHA-256" | head -1
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: korailplus-apk
          path: bin/*.apk

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          generate_release_notes: true
